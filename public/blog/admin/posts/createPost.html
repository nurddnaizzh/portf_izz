    <title>Admin Section - Add Posts</title>

    <!-- font awesome -->
    <link
      rel="stylesheet"

  <body>
    <header>
      <div class="logo">
        <h1 class="logo-text"><span>Kitty</span>Ku</h1>
      </div>
      <i class="fa-solid fa-bars menu-toggle"></i>
      <ul class="nav">
        <li>
          <a href="#">
            <i class="fa-solid fa-user"></i>
            Coolest Admin
            <i class="fa-solid fa-chevron-down"></i>
          </a>
          <ul>
            <li><a href="#" class="logout">Logout</a></li>
          </ul>
        </li>
      </ul>
    </header>

    <!-- admin page wrapper -->

    <div class="admin-wrapper">
      <!-- left sidebar -->
      <div class="left-sidebar">
        <ul>
          <li><a href="indexPost.html">Manage Posts</a></li>
          <li><a href="../users/indexUser.html">Manage Users</a></li>
          <li><a href="../topics/indexTopic.html">Manage Topics</a></li>
        </ul>
      </div>
      <!-- end of left sidebar -->

      <!-- admin content -->
      <div class="admin-content">
        <div class="button-group">
          <a href="createPost.html" class="btn btn-big">Add Post</a>
          <a href="indexPost.html" class="btn btn-big">Manage Post</a>
        </div>

        <div class="content">
          <h2 class="page-title">Add Posts</h2>

          <form action="createPost.html" method="post">
            <div>
              <label>Title</label>
              <input type="text" name="title" class="text-input" />
              <label>Body</label>
              <div id="body"></div>
            </div>
            <div>
              <label>Topic</label>
              <select name="topic" class="text-input">
                <option value="Poetry">Poetry</option>
                <option value="Life Lessons">Life Lessons</option>
              </select>
            </div>
            <button type="submit" class="btn btn-big">Add Post</button>
          </form>
        </div>
      </div>
      <!-- end of admin content -->
    </div>
    <!-- end of page wrapper -->

    <!-- JQuery -->
